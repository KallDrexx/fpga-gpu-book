<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img"><title>Button input pipeline: synchronizer, debounce, edge detect, counter</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker></defs><rect width="900" height="150" fill="#ffffff"/><text x="10" y="50" font-size="12" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="bold">i_Switch_1</text><text x="10" y="66" font-size="11" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">(asynchronous)</text><rect x="125" y="30" width="140" height="64" rx="6" fill="#eaf1f8" stroke="#2b3a4a" stroke-width="1.5"/><text x="195.0" y="58.5" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="600">synchronizer</text><text x="195.0" y="73.5" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">2 flip-flops</text><rect x="290" y="30" width="140" height="64" rx="6" fill="#eaf1f8" stroke="#2b3a4a" stroke-width="1.5"/><text x="360.0" y="58.5" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="600">debounce</text><text x="360.0" y="73.5" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">stable for</text><text x="360.0" y="87.5" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">10 ms</text><rect x="455" y="30" width="140" height="64" rx="6" fill="#eaf1f8" stroke="#2b3a4a" stroke-width="1.5"/><text x="525.0" y="58.5" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a