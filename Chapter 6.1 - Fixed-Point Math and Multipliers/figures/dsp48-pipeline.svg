<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 150" width="860" height="150" role="img"><title>DSP48 pipeline: one register per stage, latency of four clock edges</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker></defs><rect width="860" height="150" fill="#ffffff"/><text x="20" y="92" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="bold">inputs</text><rect x="160" y="60" width="130" height="56" rx="6" fill="#eaf1f8" stroke="#2b3a4a" stroke-width="1.5"/><text x="225.0" y="84.5" font-size="12.5" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="600">r_a, r_b</text><text x="225.0" y="99.5" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">AREG / BREG</text><circle cx="174" cy="48" r="11" fill="#fff" stroke="#2b3a4a" stroke-width="1.3"/><text x="174" y="52.5" font-size="12" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#2b3a4a" font-weight="bold">1</text><rect x="330" y="60" width="130" height="56" rx="6" fill="#eaf1f8" stroke="#2b3a4a" stroke-width="1.5"/><text x="395.0" y="84.5" font-size="12.5" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="600">r_m</text><text x="395.0" y="99.5" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">MREG</text><circle cx="344" cy="48" r="11" fill="#fff" stroke="#2b3a4a" stroke-width="1.3"/><text x="344" y="52.5" font-size="12" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#2b3a4a" font-weight="bold">2</text><rect x="480" y="60" width="130" height="56" rx="6" fill="#eaf1f8" stroke="#2b3a4a" stroke-width="1.5"/><tex