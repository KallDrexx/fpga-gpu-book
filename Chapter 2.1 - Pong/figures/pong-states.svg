<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img"><title>Pong game states</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker></defs><rect width="720" height="280" fill="#ffffff"/><rect x="40" y="90" width="110" height="50" rx="6" fill="#fff1cf" stroke="#2b3a4a" stroke-width="1.5"/><text x="95.0" y="119.5" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="600">SERVE</text><rect x="400" y="90" width="110" height="50" rx="6" fill="#eaf1f8" stroke="#2b3a4a" stroke-width="1.5"/><text x="455.0" y="119.5" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="600">PLAY</text><rect x="400" y="210" width="110" height="50" rx="6" fill="#eaf1f8" stroke="#2b3a4a" stroke-width="1.5"/><text x="455.0" y="239.5" font-size="13" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="600">OVER</text><polyline points="150,115 398,115" fill="none" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/><text x="274" y="106" font-size="11.5" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">SERVE_FRAMES ticks</text><polyline points="455,88 455,36 95,36 95,88" fill="none" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/><text x="275" y="28" font-size="11.5" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">point, score &lt; WIN_SCORE</text><polyline points="455,142 455,208" fill="none" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/><text x="467" y="180" font-size="11.5" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">point, score reaches WIN_SCORE</text><polyline points="398,235 95,235 95,142" fill="none" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/><text x="246" y="227" font-size="11.5" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">OVER_FRAMES ticks</text><text x="246" y="254" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">(scores cleared on the way out)</text></svg>
