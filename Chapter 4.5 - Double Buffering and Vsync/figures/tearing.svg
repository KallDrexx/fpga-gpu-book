<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img"><title>Tearing: the beam is at row 90 when the engine redraws the bar</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker></defs><rect width="700" height="300" fill="#ffffff"/><rect x="60" y="30" width="250" height="216" fill="#fff" stroke="#2b3a4a" stroke-width="1.8"/><rect x="120" y="30" width="14" height="81.0" fill="#9fb3c8" stroke="#2b3a4a"/><rect x="210" y="111.0" width="14" height="135.0" fill="#7fbf8a" stroke="#2b3a4a"/><line x1="46" y1="111.0" x2="324" y2="111.0" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/><text x="40" y="115.0" font-size="12" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" fill="#c0392b" font-weight="600">beam</text><text x="60" y="20" font-size="11" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">row 0</text><text x="60" y="262" font-size="11" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">row 239</text><text x="340" y="60" font-size="12.5" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" fill="#2b3a4a" font-weight="600">frame N-1: bar at x=100</text><text x="340" y="80" font-size="12" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">rows 0–89: already scanned,</text><text x="340" y="95" font-size="12" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">still the old bar</text><text x="340" y="133.0" font-size="12" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" fill="#c0392b" font-weight="normal">the beam is here at the moment of the redraw</text><text x="340" y="171.0" font-size="12" text-anchor="start" font-family="Helvetica N