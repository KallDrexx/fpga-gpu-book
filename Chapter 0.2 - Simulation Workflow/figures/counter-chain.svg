<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 120" width="760" height="120" role="img"><title>Two counters in series: a clock divider feeding an 8-bit counter</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/></marker></defs><rect width="760" height="120" fill="#ffffff"/><text x="20" y="54" font-size="13" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="bold">i_Clk</text><rect x="110" y="35" width="200" height="70" rx="6" fill="#eaf1f8" stroke="#2b3a4a" stroke-width="1.5"/><text x="210.0" y="66.5" font-size="13" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#2b3a4a" font-weight="600">counter</text><text x="210.0" y="81.5" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">MAX = CLK_HZ-1</text><rect x="420" y="35" width="200" height="70" rx="6" fill="#eaf1f8" stroke="#2b3a4a" stroke-width="1.5"/><text x="520.0" y="66.5" font-size="13" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#2b3a4a" font-weight="600">counter</text><text x="520.0" y="81.5" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#5a6b7b" font-weight="normal">WIDTH = 8</text><polyline points="70,70 108,70" fill="none" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/><text x="30" y="60" font-size="13" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#2b3a4a" font-weight="normal"></text><polyline points="310,70 418,70" fill="none" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/><text x="364" y="62" font-size="11.5" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="normal">o_wrap (tick)</text><polyline points="620,70 730,70" fill="none" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/><text x="675" y="60" font-size="11.5" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="normal">o_count[7:0]</text><polyline points="210,10 210,33" fill="none" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/><text x="222" y="24" font-size="11.5" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="normal">i_en = 1</text><polyline points="520,10 520,33" fill="none" stroke="#2b3a4a" stroke-width="1.6" marker-end="url(#ah)"/><text x="532" y="24" font-size="11.5" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#2b3a4a" font-weight="normal">i_en</text></svg>
